<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRIPTA 666</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0812;
      color: #e8dfc8;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    canvas {
      width: min(96vw, 960px);
      height: auto;
      border: 3px solid #b3122b;
      background: #000;
      image-rendering: pixelated;
    }
    p { margin: 0; font-size: 15px; text-align: center; padding: 0 12px; }
    kbd {
      background: #2a1836;
      border: 1px solid #5b3a73;
      border-radius: 3px;
      padding: 1px 6px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>
  <p>
    Mover: <kbd>A</kbd> <kbd>D</kbd> o flechas &nbsp; Saltar: <kbd>W</kbd> / <kbd>Espacio</kbd> &nbsp;
    Disparar: <kbd>J</kbd> &nbsp; Golpe: <kbd>K</kbd> &nbsp; Empezar: <kbd>Enter</kbd>
  </p>
  <script src="game.js"></script>
</body>
</html>
